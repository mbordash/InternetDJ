app = "your-app-name"
primary_region = "iad"

# Machine topology (counts are NOT set by this file — see `fly scale count`):
#   app             2  web, kept warm for the DAW
#   worker          1  AI loop generation
#   masterworker    1  auto-master ffmpeg passes
#   analysisworker  1  tempo/key detection on upload
#   cron            1  supercronic; MUST stay at 1
#
# The cron group is the one count that is not a tuning choice: every extra cron
# machine runs the whole crontab again, so a second one duplicates the cleanup
# jobs and the nightly backup.

# Runs on a temporary machine after the image is built and before the new
# release takes traffic, so schema the new code depends on exists before any
# request can hit it. profile.js reads coin_events for balances and the
# leaderboard, and music.js reads the AI-training consent columns on every song
# edit; a deploy-then-migrate ordering 500s those the moment the release lands.
# Every migration here is idempotent, so re-running them on each deploy is fine,
# and a non-zero exit aborts the deploy.
#
# Chained through `sh -c` because fly execs this as a command line rather than
# a shell script, so a bare `&&` would be passed along as an argument. Add new
# migrations to the end of the chain: schema.sql alone is not enough, since it
# only runs when the database container initialises from empty.
[deploy]
  release_command = 'sh -c "node backend/scripts/migrateCoinEvents.js && node backend/scripts/migrateAiTrainingConsent.js && node backend/scripts/migrateStemsToLoops.js && node backend/scripts/migrateProfileSlugs.js && node backend/scripts/migrateArticles.js && node backend/scripts/migrateJobQueue.js && node backend/scripts/applyRecoveredImages.js && node backend/scripts/migrateReviewReplies.js && node backend/scripts/migrateSongVisibility.js && node backend/scripts/migrateReleases.js && node backend/scripts/migrateProjectSampleCascade.js && node backend/scripts/migrateClipVolume.js && node backend/scripts/migrateLoopDurationPrecision.js"'

[build]
dockerfile = "dockerfile"

[env]
NODE_ENV = "production"
REACT_APP_API_URL = "/api"

[http_service]
internal_port = 5000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 2
processes = ["app"]

[processes]
app = "node backend/server.js"
worker = "node backend/workers/loopWorker.js"
# Auto-master runs several full ffmpeg passes per job. It gets its own
# process so its CPU load stays off the web machines and so it can be
# scaled on its own when mastering is worth paying more for.
masterworker = "node backend/workers/masterWorker.js"
# Tempo/key detection on upload. Its own process for the same reason as
# mastering: it is CPU work that should not land on a web machine. Note that
# defining [processes] at all means fly ignores the dockerfile CMD, so a worker
# that is not listed here simply never runs.
analysisworker = "node backend/workers/analysisWorker.js"
cron = "supercronic /app/crontab"

# The worker and cron groups deliberately have no [[services]] block. They take
# no inbound traffic, so there is nothing for the proxy to route and nothing to
# autostop against: a portless service block reads like it controls scale, but
# it does not. Their machine counts come from `fly scale count`, and they are
# left running because a queue worker with no inbound connections would never
# get an autostart trigger to wake it back up.

[[vm]]
memory = "1gb"
cpu_kind = "shared"
cpus = 1

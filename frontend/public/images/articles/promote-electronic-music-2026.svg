<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="A neon sunset over a perspective grid, with an audio waveform broadcasting outward.">
  <title>Promoting electronic music in 2026</title>
  <!--
    Original artwork for the guide. Drawn rather than sourced so there is no
    licence attached to it, and as SVG so it stays sharp on a card, in a
    share preview and on a retina display from one file of a few kilobytes.

    Palette is taken from retro.css so the image belongs to the same site as
    the page around it: void-0 through void-3 for the ground, neon magenta and
    cyan for the light, amber in the sun.

    Sized 1200x630 - the Open Graph card ratio - because this doubles as the
    share image, and a hero cropped to that shape later would lose the sun.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#04010c"/>
      <stop offset="45%"  stop-color="#140628"/>
      <stop offset="100%" stop-color="#1d0a38"/>
    </linearGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffb020"/>
      <stop offset="45%"  stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#ff2f8e"/>
    </linearGradient>

    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ff2f8e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2f8e" stop-opacity="0"/>
    </radialGradient>

    <!-- The horizontal slices through the sun. A mask rather than drawn bars,
         so the stripes are the background showing through and stay correct if
         the gradient behind them ever changes. -->
    <mask id="sunSlices">
      <rect x="0" y="0" width="1200" height="630" fill="#000"/>
      <circle cx="600" cy="300" r="170" fill="#fff"/>
      <g fill="#000">
        <rect x="380" y="322" width="440" height="7"/>
        <rect x="380" y="342" width="440" height="9"/>
        <rect x="380" y="366" width="440" height="11"/>
        <rect x="380" y="394" width="440" height="13"/>
        <rect x="380" y="426" width="440" height="16"/>
      </g>
    </mask>

    <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#04010c" opacity="0.18"/>
    </pattern>

    <clipPath id="belowHorizon">
      <rect x="0" y="430" width="1200" height="200"/>
    </clipPath>

    <!-- Everything above the horizon line. The sun is clipped to this so it
         sets behind the grid; unclipped, its lower arc drew over the ground
         plane and the whole thing read as a ball hovering above it. -->
    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="1200" height="430"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <ellipse cx="600" cy="330" rx="420" ry="260" fill="url(#glow)"/>

  <!-- Sun -->
  <g clip-path="url(#aboveHorizon)">
    <circle cx="600" cy="300" r="170" fill="url(#sun)" mask="url(#sunSlices)"/>
  </g>

  <!-- Broadcast arcs: the track leaving the studio and reaching outward, which
       is what the guide is about. Struck from the centre of the sun. -->
  <g fill="none" stroke="#00f0ff" stroke-linecap="round">
    <path d="M 795 300 A 195 195 0 0 1 795 300" stroke-opacity="0"/>
    <path d="M 782 238 A 200 200 0 0 1 782 362" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M 826 212 A 250 250 0 0 1 826 388" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M 870 186 A 300 300 0 0 1 870 414" stroke-opacity="0.18" stroke-width="3"/>
    <path d="M 418 238 A 200 200 0 0 0 418 362" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M 374 212 A 250 250 0 0 0 374 388" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M 330 186 A 300 300 0 0 0 330 414" stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <!-- Horizon -->
  <rect x="0" y="428" width="1200" height="3" fill="#00f0ff" opacity="0.85"/>
  <rect x="0" y="431" width="1200" height="14" fill="#00f0ff" opacity="0.12"/>

  <!-- Perspective grid. Verticals converge on the vanishing point under the
       sun; horizontals tighten toward it, which is what reads as distance. -->
  <g clip-path="url(#belowHorizon)" stroke="#00f0ff" fill="none">
    <g stroke-opacity="0.4" stroke-width="2">
      <path d="M600 430 L -560 630"/>  <path d="M600 430 L -240 630"/>
      <path d="M600 430 L  40 630"/>   <path d="M600 430 L 260 630"/>
      <path d="M600 430 L 430 630"/>   <path d="M600 430 L 540 630"/>
      <path d="M600 430 L 660 630"/>   <path d="M600 430 L 770 630"/>
      <path d="M600 430 L 940 630"/>   <path d="M600 430 L1160 630"/>
      <path d="M600 430 L1440 630"/>   <path d="M600 430 L1760 630"/>
    </g>
    <g stroke-opacity="0.3" stroke-width="2">
      <path d="M0 442 H1200"/> <path d="M0 458 H1200"/> <path d="M0 480 H1200"/>
      <path d="M0 510 H1200"/> <path d="M0 550 H1200"/> <path d="M0 600 H1200"/>
    </g>
  </g>

  <!-- Waveform, sitting on the horizon. Deliberately irregular: an evenly
       stepped bar chart reads as a loading spinner, not as audio. -->
  <g fill="url(#bars)">
    <rect x="150" y="388" width="9" height="40" rx="2"/>
    <rect x="172" y="356" width="9" height="72" rx="2"/>
    <rect x="194" y="402" width="9" height="26" rx="2"/>
    <rect x="216" y="330" width="9" height="98" rx="2"/>
    <rect x="238" y="372" width="9" height="56" rx="2"/>
    <rect x="260" y="300" width="9" height="128" rx="2"/>
    <rect x="282" y="384" width="9" height="44" rx="2"/>
    <rect x="304" y="344" width="9" height="84" rx="2"/>
    <rect x="326" y="406" width="9" height="22" rx="2"/>

    <rect x="864" y="398" width="9" height="30" rx="2"/>
    <rect x="886" y="348" width="9" height="80" rx="2"/>
    <rect x="908" y="380" width="9" height="48" rx="2"/>
    <rect x="930" y="312" width="9" height="116" rx="2"/>
    <rect x="952" y="392" width="9" height="36" rx="2"/>
    <rect x="974" y="338" width="9" height="90" rx="2"/>
    <rect x="996" y="404" width="9" height="24" rx="2"/>
    <rect x="1018" y="362" width="9" height="66" rx="2"/>
    <rect x="1040" y="386" width="9" height="42" rx="2"/>
  </g>

  <!-- Scanlines, the same treatment the site uses over photography. Drawn as a
       pattern across the whole image rather than as individual bars, which had
       covered only the top strip and left a visible band there. -->
  <rect width="1200" height="630" fill="url(#scan)"/>
</svg>
